name: Release

# Publishes to npm, then lists that version on the MCP Registry, when a GitHub Release is published.
# The release is the human gate: nothing reaches npm until someone deliberately publishes one.
#
# No NPM_TOKEN. This uses npm Trusted Publishing (OIDC), so npm trusts this repository and this
# workflow file directly, and there is no long-lived credential to leak or rotate.
#
# ONE-TIME SETUP on npmjs.com, under the matrix42-mcp package -> Settings -> Trusted Publisher:
#     Organization or user: sus-tech-gmbh
#     Repository:           matrix42-mcp
#     Workflow filename:    release.yml      <- must match this file's name EXACTLY, including .yml
#
# The package must already exist on npm before that setting appears, so the very first publish is
# a manual `npm publish` from a maintainer's machine. Every release after that is automatic.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than the bundled version.
      - run: npm install -g npm@latest

      - run: npm ci

      # A release tagged v1.2.3 must carry version 1.2.3, or a mistyped tag ships the wrong thing.
      # Skipped for a manual dispatch, which has no tag to compare against.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing $PKG"

      # Provenance is generated automatically under OIDC; the flag makes the intent explicit and
      # fails loudly if the conditions for it are ever not met.
      - run: npm publish --provenance --access public

  # Lists the release on the official MCP Registry (registry.modelcontextprotocol.io).
  #
  # Also no token: `login github-oidc` exchanges this job's OIDC token, which the registry trusts to
  # publish under io.github.<repository owner>/*. That is the namespace server.json is named in.
  #
  # A separate job so a registry failure never blocks npm, and "Re-run failed jobs" retries only
  # this. The registry checks the version is on npm and that its package.json carries the matching
  # mcpName, so it must run after the publish; npm can take a minute to serve a new version, which
  # is the usual reason for a first-attempt failure here.
  registry:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and checksummed rather than "latest", so the tool holding our publish rights is the
      # one that was reviewed. Values from the release's registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
