<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="You talk to an AI assistant, which talks to matrix42-mcp over MCP, which talks to your Matrix42 instance over REST. Credentials stay in the server and never reach the assistant.">
  <defs>
    <style>
      .lbl   { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .sub   { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .edge  { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .flow  { stroke: #94a3b8; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- You -->
  <rect x="20" y="70" width="130" height="70" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="85" y="100" text-anchor="middle" class="lbl" fill="#1e293b">You</text>
  <text x="85" y="120" text-anchor="middle" class="sub" fill="#475569">ask in plain language</text>

  <!-- Assistant -->
  <rect x="215" y="70" width="170" height="70" rx="10" fill="#5a67d8" stroke="#434190" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" class="lbl" fill="#ffffff">AI assistant</text>
  <text x="300" y="120" text-anchor="middle" class="sub" fill="#dbe1ff">Claude · Cursor · Copilot</text>

  <!-- Server -->
  <rect x="450" y="70" width="180" height="70" rx="10" fill="#2f7d95" stroke="#1d4f5e" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="middle" class="lbl" fill="#ffffff">matrix42-mcp</text>
  <text x="540" y="120" text-anchor="middle" class="sub" fill="#cfe9f2">runs on your machine</text>

  <!-- Matrix42 -->
  <rect x="700" y="70" width="180" height="70" rx="10" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
  <text x="790" y="100" text-anchor="middle" class="lbl" fill="#ffffff">Matrix42</text>
  <text x="790" y="120" text-anchor="middle" class="sub" fill="#cbd5e0">your instance</text>

  <!-- edges -->
  <path class="flow" d="M 150 105 L 208 105" marker-end="url(#arrow)"/>
  <path class="flow" d="M 385 105 L 443 105" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="flow" d="M 630 105 L 693 105" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="414" y="60" text-anchor="middle" class="edge">MCP · stdio</text>
  <text x="661" y="52" text-anchor="middle" class="edge">REST · token exchange</text>
  <text x="661" y="66" text-anchor="middle" class="edge">TLS · Explicit-Language</text>

  <!-- credential note -->
  <rect x="380" y="180" width="330" height="52" rx="9" fill="#fff8e1" stroke="#f0ad4e" stroke-width="1.5"/>
  <text x="545" y="202" text-anchor="middle" class="lbl" fill="#663c00">Credentials stay here</text>
  <text x="545" y="220" text-anchor="middle" class="sub" fill="#8a5a00">the assistant never sees your token</text>
  <path d="M 540 140 L 540 176" stroke="#f0ad4e" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
</svg>
